# 应急配置：只用 HTTP，不带 HTTPS。
#
# 用途：HTTPS 配置出问题（证书没放好、域名写错、nginx -t 不通过）导致站点打不开时，
# 用它先把站点恢复起来，再回头慢慢配 HTTPS。
#
# 用法（在项目根目录）：
#   cp deploy/nginx/nginx.conf deploy/nginx/nginx.https.conf.bak   # 先把 HTTPS 版存好
#   cp deploy/nginx/nginx.http-only.conf deploy/nginx/nginx.conf
#   docker compose --env-file .env.production exec nginx nginx -t
#   docker compose --env-file .env.production restart nginx
#
# 恢复 HTTPS：把 nginx.https.conf.bak 换回 nginx.conf 即可。
#
# ⚠️ 这个配置接受任何 Host（包括用 IP 直接访问），且全程明文传输。
#    只当临时通道用，别长期留着。

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      "";
}

upstream blog_app {
    server app:3000;
    keepalive 32;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # 用 Let's Encrypt 的 HTTP-01 校验时保留（容器里需要挂 /var/www/certbot）
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 单文件上限：软件包 ≤2GB，媒体 ≤100MB
    client_max_body_size 2100m;
    client_body_timeout 300s;

    # 放在 server 级：所有 location 都继承，keepalive 才真的生效
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # 应用用它判断是否给会话 Cookie 加 Secure；这里是 http，不能写死 https
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_http_version 1.1;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types
        text/plain
        text/css
        text/xml
        application/javascript
        application/json
        application/xml
        application/rss+xml
        image/svg+xml;

    location /media/ {
        alias /data/media/;
        add_header Accept-Ranges bytes always;
        add_header Cache-Control "public, max-age=2592000" always;
        add_header X-Content-Type-Options nosniff always;
        access_log off;
        open_file_cache max=2000 inactive=60s;
        open_file_cache_valid 120s;
        open_file_cache_min_uses 2;
        open_file_cache_errors on;
        try_files $uri =404;
    }

    location /software-files/ {
        alias /data/software/;
        add_header Accept-Ranges bytes always;
        add_header Cache-Control "public, max-age=86400" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    location /api/admin/software/files/upload/ {
        proxy_pass http://blog_app;
        proxy_request_buffering off;
        client_max_body_size 2100m;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location /api/admin/media/upload/ {
        proxy_pass http://blog_app;
        proxy_request_buffering off;
        client_max_body_size 200m;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /_next/static/ {
        proxy_pass http://blog_app;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }

    location ~* ^/(cursor-cat\.png|favicon\.ico|icon\.svg)$ {
        proxy_pass http://blog_app;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=604800" always;
        access_log off;
    }

    location /vditor/ {
        proxy_pass http://blog_app;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=86400" always;
        access_log off;
    }

    location / {
        proxy_pass http://blog_app;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}

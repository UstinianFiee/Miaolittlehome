# Nginx 站点配置（挂载到 /etc/nginx/conf.d/default.conf）
#
# 职责：
#   1. 媒体与安装包直出（带 Range 支持，生产不再走应用的 /media 路由）
#   2. 其余请求反代到 Next.js 应用容器
#   3. 传递真实客户端 IP（评论限频与 IP 归属地依赖它）
#
# HTTPS 见同目录 ssl.conf.example

upstream blog_app {
    server app:3000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # 单文件上限：软件包 ≤2GB，媒体 ≤100MB
    client_max_body_size 2100m;
    client_body_timeout 300s;

    # 应用使用 X-Forwarded-For 取客户端 IP（评论限频、IP 归属地）
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # 应用用它判断是否给会话 Cookie 加 Secure（纯 HTTP 部署不能加，否则浏览器丢弃）
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;

    # ---------- 压缩 ----------
    # Next.js 自己也会压缩，但只覆盖它生成的那部分响应；
    # 这里兜底把其余文本响应一并压掉（已有 Content-Encoding 的响应不会被重复压缩）。
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types
        text/plain
        text/css
        text/xml
        application/javascript
        application/json
        application/xml
        application/rss+xml
        image/svg+xml;

    # ---------- 媒体直出 ----------
    # /media/xxx → /data/media/xxx；Nginx 原生支持 Range，视频可拖动进度条
    location /media/ {
        alias /data/media/;
        add_header Accept-Ranges bytes always;
        add_header Cache-Control "public, max-age=2592000" always;
        access_log off;
        open_file_cache max=2000 inactive=60s;
        open_file_cache_valid 120s;
        open_file_cache_min_uses 2;
        open_file_cache_errors on;
        try_files $uri =404;
    }

    # ---------- 软件安装包直出 ----------
    location /software-files/ {
        alias /data/software/;
        add_header Accept-Ranges bytes always;
        add_header Cache-Control "public, max-age=86400" always;
        try_files $uri =404;
    }

    # ---------- 大文件分片上传：关闭请求缓冲，边收边转 ----------
    location /api/admin/software/files/upload/ {
        proxy_pass http://blog_app;
        proxy_request_buffering off;
        client_max_body_size 2100m;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location /api/admin/media/upload/ {
        proxy_pass http://blog_app;
        proxy_request_buffering off;
        client_max_body_size 200m;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ---------- Next.js 静态资源（内容哈希，可长缓存） ----------
    location /_next/static/ {
        proxy_pass http://blog_app;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }

    # ---------- 站点内的小静态文件（Next 默认给 max-age=0，这里补长缓存） ----------
    location ~* ^/(cursor-cat\.png|favicon\.ico|icon\.svg)$ {
        proxy_pass http://blog_app;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=604800" always;
        access_log off;
    }

    # 编辑器静态资源（vditor）：内容随版本变化，按天缓存即可
    location /vditor/ {
        proxy_pass http://blog_app;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=86400" always;
        access_log off;
    }

    # ---------- 其余请求 ----------
    location / {
        proxy_pass http://blog_app;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}

# Nginx 站点配置（挂载到 /etc/nginx/conf.d/default.conf）
#
# 职责：
#   1. 媒体与安装包直出（带 Range 支持，生产不再走应用的 /media 路由）
#   2. 其余请求反代到 Next.js 应用容器
#   3. 传递真实客户端 IP（评论限频与 IP 归属地依赖它）
#
# HTTPS 见同目录 ssl.conf.example

upstream blog_app {
    server app:3000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # 单文件上限：软件包 ≤2GB，媒体 ≤100MB
    client_max_body_size 2100m;
    client_body_timeout 300s;

    # 应用使用 X-Forwarded-For 取客户端 IP（评论限频、IP 归属地）
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;

    # ---------- 媒体直出 ----------
    # /media/xxx → /data/media/xxx；Nginx 原生支持 Range，视频可拖动进度条
    location /media/ {
        alias /data/media/;
        add_header Accept-Ranges bytes always;
        add_header Cache-Control "public, max-age=2592000" always;
        access_log off;
        try_files $uri =404;
    }

    # ---------- 软件安装包直出 ----------
    location /software-files/ {
        alias /data/software/;
        add_header Accept-Ranges bytes always;
        add_header Cache-Control "public, max-age=86400" always;
        try_files $uri =404;
    }

    # ---------- 大文件分片上传：关闭请求缓冲，边收边转 ----------
    location /api/admin/software/files/upload/ {
        proxy_pass http://blog_app;
        proxy_request_buffering off;
        client_max_body_size 2100m;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location /api/admin/media/upload/ {
        proxy_pass http://blog_app;
        proxy_request_buffering off;
        client_max_body_size 200m;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ---------- Next.js 静态资源（内容哈希，可长缓存） ----------
    location /_next/static/ {
        proxy_pass http://blog_app;
        proxy_cache_valid 200 60m;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }

    # ---------- 其余请求 ----------
    location / {
        proxy_pass http://blog_app;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}

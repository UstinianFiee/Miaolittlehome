# Nginx 站点配置（挂载到 /etc/nginx/conf.d/default.conf）
#
# 职责：
#   1. HTTPS 终结（证书放 deploy/nginx/certs/）
#   2. 80 端口只做跳转，并保留 ACME 校验路径
#   3. 媒体与安装包直出（带 Range 支持，生产不再走应用的 /media 路由）
#   4. 其余请求反代到 Next.js 应用容器
#   5. 传递真实客户端 IP（评论限频与 IP 归属地依赖它）
#   6. 拒绝用 IP 或未知域名直接访问
#
# ---------------------------------------------------------------
# 只需要改 1 处：下面的 map 里填你的域名
# ---------------------------------------------------------------
#   1. 证书放进 deploy/nginx/certs/，命名成 fullchain.pem 与 privkey.pem
#      （文件名不一样就改 443 段里 ssl_certificate / ssl_certificate_key 两行）
#   2. 改下面的 `map $host $site_canonical`（**全文件唯一需要填域名的地方**）
#   3. 先校验再重载：
#        docker compose --env-file .env.production exec nginx nginx -t
#        docker compose --env-file .env.production restart nginx
#   4. 别忘了把 .env.production 里的 NEXT_PUBLIC_SITE_URL 改成 https://你的域名
#      并重新构建（这个值在构建期内联进产物）：
#        docker compose --env-file .env.production up -d --build
#
# 证书文件缺失时 nginx -t 会直接报错 —— 这是有意的，避免"以为开了 HTTPS 其实没开"。
#
# 为什么域名只写一处：早先的写法把域名同时写在 80 段和 443 段的 server_name 里，
# 只改了其中一处就会出现「HTTPS 能开、HTTP 直接连不上」——因为 HTTP 的 Host 匹配不上
# 域名 server，落到 default_server 被 444 断掉了。用 map 之后不存在这个坑。

# ---------------------------------------------------------------
# 域名映射 —— **整个文件只有这一处需要填域名**
#   左边：访问时用的 Host；右边：统一跳转到的规范域名（不带 www）
#   没列出来的 Host（用 IP 直连、扫描器、未知域名）映射成空串 → 直接断开
# ⚠️ 证书不覆盖 www 的话，把 www 那一行删掉：否则 https://www.你的域名
#    会在 TLS 握手阶段就因为证书域名不匹配而失败，根本走不到跳转。
# ---------------------------------------------------------------
map $host $site_canonical {
    default                  "";
    example.com              example.com;      # ← 改成你的域名
    www.example.com          example.com;      # ← 改成你的域名（证书不含 www 就删掉本行）
}

# WebSocket 升级用。用 map 而不是写死 "upgrade"：
# 写死会让**每个**请求都带上 Connection: upgrade，upstream 的 keepalive 就失效了，
# 每个静态资源都要新建一条到应用容器的连接。
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      "";
}

upstream blog_app {
    server app:3000;
    keepalive 32;
}

# ---------------------------------------------------------------
# 80：只做跳转（+ ACME 校验）；其它 Host 直接断开
# ---------------------------------------------------------------
# 注意「拒绝」写在 location 里而不是 server 级：server 级的 return 跑在 rewrite 阶段、
# 早于 location 匹配，会把下面的 /.well-known/acme-challenge/ 一起挡掉，证书就没法续期。
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Let's Encrypt 续期要用；用其它证书方式可以删掉这一段
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        # 非本站域名（含用 IP 直连）直接断开
        if ($site_canonical = "") {
            return 444;
        }
        # 一定要带 $request_uri：少了它所有 HTTP 访问都会被甩到首页，深层链接和查询串全丢
        return 301 https://$site_canonical$request_uri;
    }
}

# ---------------------------------------------------------------
# 443：只接受配置好的域名，其它（IP 直连、未知域名）断开
# ---------------------------------------------------------------
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # 现代兼容性配置（TLS 1.2+）
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # 非本站域名（含用 IP 直连）直接断开。
    # 用 IP 访问时浏览器会先提示证书不匹配，然后连接被断开 —— 符合"不接受 IP 直连"。
    if ($site_canonical = "") {
        return 444;
    }

    # www 统一跳到规范域名（证书不含 www 时上面那行已删，这里也不会被触发）
    if ($host != $site_canonical) {
        return 301 https://$site_canonical$request_uri;
    }

    # ⚠️ nginx 的 add_header 是「本层有就不继承上层」：下面每个自己写了 add_header 的
    #    location 都会丢掉这三行。媒体和软件包是用户上传内容，那两个 location 里单独补了
    #    nosniff；其余静态资源 location 影响很小，没有重复添加。
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # HSTS：让浏览器以后只用 HTTPS 访问这个域名。
    # ⚠️ 一旦浏览器记住了（默认 1 年），在你没把握长期续期证书之前**不要打开**，
    #    开了之后证书一过期访问就会被浏览器直接拦死、且无法用"继续访问"绕过。
    # 确认 HTTPS 稳定运行一段时间后再取消注释：
    # add_header Strict-Transport-Security "max-age=31536000" always;

    # 单文件上限：软件包 ≤2GB，媒体 ≤100MB
    client_max_body_size 2100m;
    client_body_timeout 300s;

    # 应用使用 X-Forwarded-For 取客户端 IP（评论限频、IP 归属地）
    # 放在 server 级，所有 location 都会继承；location 自己没写 proxy_set_header 才会继承，
    # 所以下面各 location 都不要再重复写，免得漏掉 Connection 让 keepalive 失效。
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # 应用用它判断是否给会话 Cookie 加 Secure —— 这里必须是 https
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_http_version 1.1;

    # ---------- 压缩 ----------
    # Next.js 自己也会压缩，但只覆盖它生成的那部分响应；
    # 这里兜底把其余文本响应一并压掉（已有 Content-Encoding 的响应不会被重复压缩）。
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types
        text/plain
        text/css
        text/xml
        application/javascript
        application/json
        application/xml
        application/rss+xml
        image/svg+xml;

    # ---------- 媒体直出 ----------
    # /media/xxx → /data/media/xxx；Nginx 原生支持 Range，视频可拖动进度条
    location /media/ {
        alias /data/media/;
        add_header Accept-Ranges bytes always;
        add_header Cache-Control "public, max-age=2592000" always;
        # 本层写了 add_header 就丢了 server 级的，这里补回最要紧的一条
        add_header X-Content-Type-Options nosniff always;
        access_log off;
        open_file_cache max=2000 inactive=60s;
        open_file_cache_valid 120s;
        open_file_cache_min_uses 2;
        open_file_cache_errors on;
        try_files $uri =404;
    }

    # ---------- 软件安装包直出 ----------
    location /software-files/ {
        alias /data/software/;
        add_header Accept-Ranges bytes always;
        add_header Cache-Control "public, max-age=86400" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    # ---------- 大文件分片上传：关闭请求缓冲，边收边转 ----------
    location /api/admin/software/files/upload/ {
        proxy_pass http://blog_app;
        proxy_request_buffering off;
        client_max_body_size 2100m;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location /api/admin/media/upload/ {
        proxy_pass http://blog_app;
        proxy_request_buffering off;
        client_max_body_size 200m;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ---------- Next.js 静态资源（内容哈希，可长缓存） ----------
    location /_next/static/ {
        proxy_pass http://blog_app;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }

    # ---------- 站点内的小静态文件（Next 默认给 max-age=0，这里补长缓存） ----------
    location ~* ^/(cursor-cat\.png|favicon\.ico|icon\.svg)$ {
        proxy_pass http://blog_app;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=604800" always;
        access_log off;
    }

    # 编辑器静态资源（vditor）：内容随版本变化，按天缓存即可
    location /vditor/ {
        proxy_pass http://blog_app;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=86400" always;
        access_log off;
    }

    # ---------- 其余请求 ----------
    location / {
        proxy_pass http://blog_app;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}

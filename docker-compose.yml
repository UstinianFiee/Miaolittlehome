# 生产编排：应用容器 + Nginx 反代
#
# 首次空库部署见 docs/部署手册.md；已有站点见 docs/更新手册.md。
# 升级保留原 .env.production、数据挂载和项目目录，RUN_SEED 必须为 false。
# 核对挂载并完成停机冷备份后，才执行：
#   docker compose --env-file .env.production up -d --build
#
# 注意 --env-file：构建阶段要把 NEXT_PUBLIC_SITE_URL 内联进产物（见下方 build.args），
# 而这个值来自 compose 的插值环境文件，默认只读项目根目录的 .env。
#
# ---------- 数据卷 ----------
# 数据库、媒体、软件包、备份**全部落在宿主机的同一个目录**里，容器内统一挂到 /data。
# 默认宿主机目录是 /data；想放到别处（比如项目下的 ./data 或另一块盘）就在
# .env.production 里加一行 DATA_DIR=/your/path —— 下面所有挂载都跟着走。
#
#   DATA_DIR/db/blog.db     SQLite 数据库
#   DATA_DIR/media/         图片、音频、视频（Nginx 直出）
#   DATA_DIR/software/      软件安装包（Nginx 直出）
#   DATA_DIR/backups/       导出包与导入前的自动快照
#
# 升级保留原数据目录及生产配置，关闭 seed；先停写再冷备份完整目录（含 WAL）。
# 配置和证书另行备份；迁移可能改变数据库，保留挂载不能替代备份与验收。
# 宿主机目录的属主要设成 1001:1001（容器里的运行用户），否则会写不进去。

services:
  app:
    build:
      context: .
      target: runner
      args:
        # NEXT_PUBLIC_* 会在构建期内联进产物（sitemap.xml / robots.txt 依赖它），
        # 所以必须在构建期传入。值取自 compose 的插值环境文件，
        # 因此启动命令要带 --env-file .env.production（见 docs 里的部署手册）。
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
        # 下面三个是构建期的软件源，国内默认值已经调好，一般不用改。
        # 腾讯云内网机器把 APT_MIRROR 改成 mirrors.tencentyun.com 会更快（走内网）。
        # 海外机器可分别改成 deb.debian.org / https://registry.npmjs.org /
        # https://binaries.prisma.sh。写在 .env.production 里即可生效。
        APT_MIRROR: ${APT_MIRROR:-mirrors.aliyun.com}
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}
        PRISMA_ENGINES_MIRROR: ${PRISMA_ENGINES_MIRROR:-https://registry.npmmirror.com/-/binary/prisma}
    image: blog-app:latest
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      # 存储路径：容器内固定用 /data，宿主机目录由 DATA_DIR 决定（见上方说明）
      DATA_DIR: /data
      DATABASE_URL: file:/data/db/blog.db
      MEDIA_DIR: /data/media
      SOFTWARE_DIR: /data/software
      # 内容导出 / 导入的暂存目录（分片临时文件、导入前的自动快照）
      BACKUP_DIR: /data/backups
    volumes:
      - ${DATA_DIR:-/data}:/data
    expose:
      - "3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/zh').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # 媒体与安装包由 Nginx 直出，只读挂载（与 app 用同一个宿主机目录）
      - ${DATA_DIR:-/data}/media:/data/media:ro
      - ${DATA_DIR:-/data}/software:/data/software:ro
      # SSL 证书占位目录（放入证书后启用 deploy/nginx/ssl.conf.example）
      - ./deploy/nginx/certs:/etc/nginx/certs:ro
    depends_on:
      # 用 service_started 而非 service_healthy：应用启动稍慢时 Nginx 先起，
      # 短暂 502 属正常，避免健康检查异常导致整个栈起不来
      app:
        condition: service_started
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

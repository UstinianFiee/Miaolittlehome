# 生产编排：应用容器 + Nginx 反代
#
# 使用方式（在项目根目录）：
#   cp deploy/.env.production.example .env.production   # 填好密钥
#   sudo mkdir -p /data && sudo chown -R 1001:1001 /data
#   docker compose --env-file .env.production up -d --build
#
# 注意 --env-file：构建阶段要把 NEXT_PUBLIC_SITE_URL 内联进产物（见下方 build.args），
# 而这个值来自 compose 的插值环境文件，默认只读项目根目录的 .env。
#
# 数据库、媒体、软件包、备份全部落在宿主机 /data 卷。

services:
  app:
    build:
      context: .
      target: runner
      args:
        # NEXT_PUBLIC_* 会在构建期内联进产物（sitemap.xml / robots.txt 依赖它），
        # 所以必须在构建期传入。值取自 compose 的插值环境文件，
        # 因此启动命令要带 --env-file .env.production（见 docs 里的部署手册）。
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
        # 构建期的 Debian 软件源。默认阿里云（国内快）；
        # 腾讯云内网机器可改成 mirrors.tencentyun.com（走内网，最快），
        # 海外机器可改成 deb.debian.org。写在 .env.production 里即可生效。
        APT_MIRROR: ${APT_MIRROR:-mirrors.aliyun.com}
    image: blog-app:latest
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      # 存储路径：与 docs/SPEC.md 的约定一致
      DATABASE_URL: file:/data/db/blog.db
      MEDIA_DIR: /data/media
      SOFTWARE_DIR: /data/software
    volumes:
      - /data:/data
    expose:
      - "3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/zh').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # 媒体与安装包由 Nginx 直出，只读挂载
      - /data/media:/data/media:ro
      - /data/software:/data/software:ro
      # SSL 证书占位目录（放入证书后启用 deploy/nginx/ssl.conf.example）
      - ./deploy/nginx/certs:/etc/nginx/certs:ro
    depends_on:
      # 用 service_started 而非 service_healthy：应用启动稍慢时 Nginx 先起，
      # 短暂 502 属正常，避免健康检查异常导致整个栈起不来
      app:
        condition: service_started
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

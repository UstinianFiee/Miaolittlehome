# 生产编排：应用容器 + Nginx 反代
#
# 使用方式（在项目根目录）：
#   cp deploy/.env.production.example .env.production   # 填好密钥
#   sudo mkdir -p /data && sudo chown -R 1001:1001 /data
#   docker compose up -d --build
#
# 数据库、媒体、软件包、备份全部落在宿主机 /data 卷。

services:
  app:
    build:
      context: .
      target: runner
    image: blog-app:latest
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      # 存储路径：与 docs/SPEC.md 的约定一致
      DATABASE_URL: file:/data/db/blog.db
      MEDIA_DIR: /data/media
      SOFTWARE_DIR: /data/software
    volumes:
      - /data:/data
    expose:
      - "3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/zh').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # 媒体与安装包由 Nginx 直出，只读挂载
      - /data/media:/data/media:ro
      - /data/software:/data/software:ro
      # SSL 证书占位目录（放入证书后启用 deploy/nginx/ssl.conf.example）
      - ./deploy/nginx/certs:/etc/nginx/certs:ro
    depends_on:
      # 用 service_started 而非 service_healthy：应用启动稍慢时 Nginx 先起，
      # 短暂 502 属正常，避免健康检查异常导致整个栈起不来
      app:
        condition: service_started
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
